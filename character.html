<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1020" />
  <title>Skyline Riot — Character Viewer</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <style>
    :root {
      --bg: #0b1020;
      --panel: rgba(12, 16, 32, 0.82);
      --cyan: #3ef0ff;
      --mag: #ff3eb5;
      --yel: #ffe566;
      --orange: #ff5a12;
      --text: #f2f4ff;
      --muted: #8a93b0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
      font-family: "Segoe UI", system-ui, sans-serif; touch-action: none; }
    #c { display: block; width: 100%; height: 100%; }
    #ui {
      position: absolute; inset: 0; pointer-events: none;
      display: flex; flex-direction: column; justify-content: space-between;
      padding: max(12px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
    }
    .top, .bottom { pointer-events: auto; }
    .top h1 {
      font-size: clamp(18px, 4vw, 26px); letter-spacing: 0.08em; text-transform: uppercase;
      text-shadow: 0 0 18px rgba(62,240,255,0.35);
    }
    .top .sub { color: var(--muted); font-size: 12px; margin-top: 4px; letter-spacing: 0.06em; }
    .badge {
      display: inline-block; margin-top: 8px; padding: 4px 10px; border-radius: 999px;
      border: 1px solid rgba(255,90,18,0.5); color: var(--orange); font-size: 11px; letter-spacing: 0.12em;
      background: rgba(255,90,18,0.08);
    }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .panel {
      background: var(--panel); backdrop-filter: blur(10px);
      border: 1px solid rgba(62,240,255,0.18); border-radius: 14px; padding: 10px 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,0.35);
    }
    button {
      appearance: none; border: 1px solid rgba(62,240,255,0.35); background: rgba(62,240,255,0.08);
      color: var(--text); font: inherit; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 10px 14px; border-radius: 10px; cursor: pointer; min-height: 42px;
      transition: background 0.15s, transform 0.1s, border-color 0.15s;
    }
    button:active { transform: scale(0.96); }
    button.active, button[aria-pressed="true"] {
      background: rgba(255,62,181,0.2); border-color: var(--mag); color: #fff;
      box-shadow: 0 0 16px rgba(255,62,181,0.25);
    }
    button.secondary { border-color: rgba(255,229,102,0.35); background: rgba(255,229,102,0.08); }
    .hint { color: var(--muted); font-size: 11px; margin-top: 8px; line-height: 1.4; }
    a.back {
      pointer-events: auto; color: var(--cyan); text-decoration: none; font-size: 13px;
      border-bottom: 1px solid rgba(62,240,255,0.35);
    }
    #fxLabel { font-size: 11px; color: var(--muted); margin-left: 4px; }
    #status { font-size: 12px; color: var(--muted); margin-top: 6px; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="ui">
    <div class="top">
      <div class="panel" style="display:inline-block;max-width:min(92vw,440px)">
        <h1>Sky Trek Skater</h1>
        <div class="sub">Open jacket · spiky hair · 2-wheel skate shoes · soft cel + rim</div>
        <span class="badge">v0.4d-char</span>
        <div id="status">Loading model…</div>
        <div style="margin-top:10px"><a class="back" href="index.html">← Back to game</a></div>
      </div>
    </div>
    <div class="bottom">
      <div class="panel">
        <div class="row" style="margin-bottom:8px">
          <button type="button" id="btnFront" aria-pressed="true">Front</button>
          <button type="button" id="btnBack" aria-pressed="false">Back</button>
          <button type="button" id="btnThree" class="secondary" aria-pressed="false">¾ View</button>
        </div>
        <div class="row" style="margin-bottom:8px">
          <button type="button" id="btnIdle" aria-pressed="true">Idle</button>
          <button type="button" id="btnSkate" aria-pressed="false">Skate</button>
          <button type="button" id="btnGrind" aria-pressed="false">Grind</button>
          <button type="button" id="btnAir" aria-pressed="false">Air</button>
        </div>
        <div class="row">
          <button type="button" id="btnFx" aria-pressed="false">Soft FX</button>
          <button type="button" id="btnAuto" aria-pressed="true">Auto-spin</button>
          <span id="fxLabel">rim boost (Verse off)</span>
        </div>
        <p class="hint">Drag to orbit · Pinch / scroll to zoom · Model only — not in game yet</p>
      </div>
    </div>
  </div>
  <script>
(function () {
  const canvas = document.getElementById('c');
  const statusEl = document.getElementById('status');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
  renderer.setClearColor(0x12182c, 1);
  renderer.outputEncoding = THREE.sRGBEncoding;
  if (renderer.physicallyCorrectLights !== undefined) renderer.physicallyCorrectLights = true;

  const scene = new THREE.Scene();
  scene.fog = new THREE.Fog(0x12182c, 10, 32);

  const camera = new THREE.PerspectiveCamera(38, 1, 0.05, 100);
  camera.position.set(0, 1.0, 3.6);

  // Soft anime lighting: key + cool rim + warm fill
  scene.add(new THREE.AmbientLight(0xb0b8d0, 0.45));
  const key = new THREE.DirectionalLight(0xfff2e0, 1.15);
  key.position.set(2.8, 5.5, 3.5);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0x7ec8ff, 0.85);
  rim.position.set(-3.5, 2.8, -4.0);
  scene.add(rim);
  const fill = new THREE.DirectionalLight(0xff8a4a, 0.28);
  fill.position.set(-2.0, 1.5, 2.5);
  scene.add(fill);
  const hemi = new THREE.HemisphereLight(0xc8d4ff, 0x2a2030, 0.35);
  scene.add(hemi);

  const floor = new THREE.Mesh(
    new THREE.CircleGeometry(1.5, 64),
    new THREE.MeshStandardMaterial({ color: 0x0a0e1c, roughness: 0.95, metalness: 0.0, transparent: true, opacity: 0.7 })
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = 0.001;
  scene.add(floor);
  const ring = new THREE.Mesh(
    new THREE.RingGeometry(1.48, 1.55, 64),
    new THREE.MeshBasicMaterial({ color: 0x3ef0ff, transparent: true, opacity: 0.28, side: THREE.DoubleSide })
  );
  ring.rotation.x = -Math.PI / 2;
  ring.position.y = 0.002;
  scene.add(ring);

  const bg = new THREE.Mesh(
    new THREE.PlaneGeometry(16, 12),
    new THREE.MeshBasicMaterial({ color: 0x161e38 })
  );
  bg.position.set(0, 2.4, -5);
  scene.add(bg);

  let root = new THREE.Group();
  scene.add(root);
  let mixer = null;
  let actions = {};
  let currentAction = null;
  let modelReady = false;

  // Orbit
  let yaw = 0.0, pitch = 0.08, dist = 3.8;
  let autoSpin = true;
  let softFx = false;
  let dragging = false, lastX = 0, lastY = 0;
  let pinchStart = 0, distStart = 0;
  let lookY = 0.95;

  function setPressed(id, on) {
    const el = document.getElementById(id);
    if (el) el.setAttribute('aria-pressed', on ? 'true' : 'false');
  }

  function setView(kind) {
    if (kind === 'front') { yaw = 0; pitch = 0.06; }
    else if (kind === 'back') { yaw = Math.PI; pitch = 0.06; }
    else { yaw = 0.55; pitch = 0.14; }
    autoSpin = false;
    setPressed('btnAuto', false);
    setPressed('btnFront', kind === 'front');
    setPressed('btnBack', kind === 'back');
    setPressed('btnThree', kind === 'three');
  }

  function playAnim(name) {
    if (!mixer || !actions[name]) {
      // Fallback aliases
      const fallback = actions.idle || Object.values(actions)[0];
      if (fallback) {
        if (currentAction && currentAction !== fallback) currentAction.fadeOut(0.25);
        fallback.reset().fadeIn(0.25).play();
        currentAction = fallback;
      }
      ['Idle','Skate','Grind','Air'].forEach(n => setPressed('btn' + n, n.toLowerCase() === name));
      return;
    }
    const next = actions[name];
    if (currentAction === next) return;
    if (currentAction) currentAction.fadeOut(0.2);
    next.reset().fadeIn(0.2).play();
    currentAction = next;
    ['Idle','Skate','Grind','Air'].forEach(n => setPressed('btn' + n, n.toLowerCase() === name));
  }

  document.getElementById('btnFront').onclick = () => setView('front');
  document.getElementById('btnBack').onclick = () => setView('back');
  document.getElementById('btnThree').onclick = () => setView('three');
  document.getElementById('btnIdle').onclick = () => playAnim('idle');
  document.getElementById('btnSkate').onclick = () => playAnim('skate');
  document.getElementById('btnGrind').onclick = () => playAnim('grind');
  document.getElementById('btnAir').onclick = () => playAnim('air');
  document.getElementById('btnFx').onclick = () => {
    softFx = !softFx;
    setPressed('btnFx', softFx);
    rim.intensity = softFx ? 1.35 : 0.85;
    document.getElementById('fxLabel').textContent = softFx ? 'strong rim' : 'rim boost (Verse off)';
  };
  document.getElementById('btnAuto').onclick = () => {
    autoSpin = !autoSpin;
    setPressed('btnAuto', autoSpin);
  };

  canvas.addEventListener('pointerdown', (e) => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
    autoSpin = false; setPressed('btnAuto', false);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    yaw -= dx * 0.007;
    pitch = Math.max(-0.3, Math.min(0.5, pitch + dy * 0.005));
  });
  canvas.addEventListener('pointerup', () => { dragging = false; });
  canvas.addEventListener('pointercancel', () => { dragging = false; });
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    dist = Math.max(2.0, Math.min(7.0, dist + e.deltaY * 0.004));
  }, { passive: false });
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchStart = Math.hypot(dx, dy);
      distStart = dist;
    }
  }, { passive: true });
  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d = Math.hypot(dx, dy);
      dist = Math.max(2.0, Math.min(7.0, distStart * (pinchStart / d)));
    }
  }, { passive: true });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  function frameModel(object) {
    const box = new THREE.Box3().setFromObject(object);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());
    object.position.x -= center.x;
    object.position.z -= center.z;
    object.position.y -= box.min.y;
    lookY = size.y * 0.52;
    dist = Math.max(size.y * 2.05, 3.2);
    floor.position.y = 0.001;
    ring.position.y = 0.002;
    statusEl.textContent = size.y.toFixed(2) + 'm · soft cel + rim';
  }

  const loader = new THREE.GLTFLoader();
  loader.load(
    'assets/character/skater.glb?v=0.4d-char',
    (gltf) => {
      const model = gltf.scene;
      model.traverse((o) => {
        if (o.isMesh) {
          o.castShadow = false;
          o.receiveShadow = false;
          if (o.material) {
            const mats = Array.isArray(o.material) ? o.material : [o.material];
            mats.forEach((m) => {
              if (!m) return;
              m.side = THREE.FrontSide;
              if (m.map) m.map.encoding = THREE.sRGBEncoding;
              // Soften toward anime: slightly lower metal, mid roughness
              if (m.roughness !== undefined) m.roughness = Math.min(0.85, Math.max(0.35, m.roughness || 0.55));
              m.needsUpdate = true;
            });
          }
        }
      });
      // VRM/glTF often faces +Z or -Z; our Blender export faces +Y in Blender = -Z in three after convert?
      // Blender Y-forward / Z-up → glTF -Z forward. Character faced +Y in Blender → faces -Z in three.
      // Rotate so front faces camera (+Z toward us when yaw=0): yaw=0 looks from +Z.
      model.rotation.y = Math.PI; // face camera
      root.add(model);
      frameModel(root);

      if (gltf.animations && gltf.animations.length) {
        mixer = new THREE.AnimationMixer(model);
        gltf.animations.forEach((clip) => {
          const key = clip.name.toLowerCase();
          actions[key] = mixer.clipAction(clip);
          actions[key].clampWhenFinished = false;
        });
        // aliases
        if (!actions.idle) {
          const first = Object.keys(actions)[0];
          if (first) actions.idle = actions[first];
        }
        playAnim('idle');
        statusEl.textContent += ' · anims: ' + Object.keys(actions).join(', ');
      } else {
        statusEl.textContent += ' · static pose';
      }
      modelReady = true;
    },
    (xhr) => {
      if (xhr.total) statusEl.textContent = 'Loading ' + Math.round(100 * xhr.loaded / xhr.total) + '%';
    },
    (err) => {
      console.error(err);
      statusEl.textContent = 'Failed to load skater.glb';
    }
  );

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (autoSpin) yaw += dt * 0.4;
    if (mixer) mixer.update(dt);

    camera.position.set(
      Math.sin(yaw) * Math.cos(pitch) * dist,
      lookY + Math.sin(pitch) * dist * 0.85,
      Math.cos(yaw) * Math.cos(pitch) * dist
    );
    camera.lookAt(0, lookY, 0);
    renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  window.__CHAR = {
    setView,
    setAnim: playAnim,
    setVerse: (v) => { softFx = !!v; setPressed('btnFx', softFx); rim.intensity = softFx ? 1.35 : 0.85; },
    setAuto: (v) => { autoSpin = !!v; setPressed('btnAuto', autoSpin); },
    getState: () => ({ yaw, pitch, dist, softFx, autoSpin, modelReady })
  };
})();
  </script>
</body>
</html>
